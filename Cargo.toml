[package]
name = "atlas_exposure"
version = "1.1.1"
edition = "2021"
authors = ["Thai Huu Loc Tran <tranthaihuuloc2@gmail.com>"]
description = "The detectable transcriptional response in single-cell chemical perturbation atlases arises above clinical drug exposure"
license = "MIT"
repository = "https://github.com/huulocmedvnu/atlas-clinical-exposure"

[[bin]]
name = "tahoe_summary"
path = "src/bin/01_tahoe_summary.rs"
[[bin]]
name = "exposure_analysis"
path = "src/bin/02_exposure_analysis.rs"
[[bin]]
name = "sciplex_de_power"
path = "src/bin/03_sciplex_de_power.rs"
[[bin]]
name = "patient_biopsies"
path = "src/bin/04_patient_biopsies.rs"
[[bin]]
name = "export_tiers"
path = "src/bin/05_export_tiers.rs"
[[bin]]
name = "export_tables"
path = "src/bin/06_export_tables.rs"

[[bin]]
name = "tahoe_profiles"
path = "src/bin/07_tahoe_profiles.rs"

[dependencies]
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow", "zstd", "snap"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rayon = "1.10"
anyhow = "1"
statrs = "0.17"
serde_json = "1"
flate2 = "1"
hdf5 = { package = "hdf5-metno", version = "0.10", features = ["static", "zlib"] }

[profile.release]
opt-level = 3
